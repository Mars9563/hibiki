apiVersion: v1
kind: Service
metadata:
  name: hibiki-server          # this NAME becomes the DNS name: http://hibiki-server:5000
  namespace: hibiki
spec:
  selector:
    app: hibiki-server         # routes to pods with this label (your Deployment's pods)
  ports:
    - port: 5000               # the port the Service listens on
      targetPort: 5000
      nodePort: 30081
  type: NodePort              # internal-only stable address (the default)
