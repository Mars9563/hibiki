apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: hibiki
spec:
  replicas: 2                       # 2 connectors = high availability; Cloudflare load-balances them
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest   # public image — no imagePullSecret needed
          args: ["tunnel", "--no-autoupdate", "run"]
          env:
            - name: TUNNEL_TOKEN                  # cloudflared reads the token from here
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
