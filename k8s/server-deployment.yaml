apiVersion: apps/v1                 # Deployments live in the "apps" API group
kind: Deployment                    # what kind of object this is
metadata:
  name: hibiki-server               # the Deployment's name
  namespace: hibiki                 # lives in our namespace
spec:
  replicas: 1                       # run ONE pod for now (Socket.IO needs a Redis adapter before >1 — Phase 5)
  selector:
    matchLabels:
      app: hibiki-server            # this Deployment owns pods carrying this label...
  template:                         # ...and this is the blueprint it stamps them from:
    metadata:
      labels:
        app: hibiki-server          # <-- MUST match the selector above, or the Deployment finds nothing
    spec:
      automountServiceAccountToken: false  # the app never talks to the Kubernetes API; don't hand it a token
      securityContext:                     # pod-wide: never root, default seccomp filter
        runAsNonRoot: true
        runAsUser: 1000                    # the image's unprivileged `node` user
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      hostAliases:
        - ip: "10.0.0.112"
          hostnames:
            - "supabase.mrsdev.in"
      imagePullSecrets:
        - name: ghcr-pull           # use our GHCR creds to pull the private image
      containers:
        - name: hibiki-server
          image: ghcr.io/mars9563/hibiki-server:44773e40baca994b48504b9ff4f43b59b5bee820
          ports:
            - containerPort: 5000   # the port the app listens on (informational)
          envFrom:
            - secretRef:
                name: hibiki-server-env   # inject ALL keys from that Secret as env vars
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # nothing is written to the image; /tmp below is the scratch space
            capabilities:
              drop: ["ALL"]
          resources:
            requests:                      # what the scheduler reserves (measured use is ~50Mi / ~1m CPU)
              cpu: 50m
              memory: 128Mi
            limits:                        # memory is capped so a bug or abusive upload can't take the whole VPS
              memory: 1Gi                  # room for 4 concurrent 75MB uploads (see middleware/uploadGuard.ts) + Sharp
              # no CPU limit on purpose: CFS throttling hurts latency, and the node is shared
          readinessProbe:                  # gate traffic and rollouts: a new pod must answer before the old one is removed
            httpGet: { path: /, port: 5000 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:                   # restart only if it is truly wedged (generous: the node is busy)
            httpGet: { path: /, port: 5000 }
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
