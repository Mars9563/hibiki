# Builds the server image for arm64 and pushes it to GHCR.
# Runs only when server code (or this workflow file) changes.
name: Build & Push Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'

# Scopes for the auto-issued GITHUB_TOKEN (a fresh token minted for each run).
permissions:
  contents: write # 'checkout' reads the repo AND the deploy step commits the manifest bump
  packages: write # let the token push to GHCR — omit this and the push 403s

jobs:
  build-server:
    runs-on: ubuntu-latest # a fresh, throwaway x86 VM
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # clone the repo onto the runner

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3 # emulate arm64 on this x86 VM

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # the builder that can target other CPUs

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # whoever triggered the run
          password: ${{ secrets.GITHUB_TOKEN }} # auto-issued, scoped by 'permissions' above

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server # build using server/ (so server/Dockerfile + .dockerignore apply)
          platforms: linux/arm64 # build AS arm64 -> npm ci fetches sharp's arm64 binary
          push: true # push the result to GHCR (not just build it)
          # two tags on the same image: 'latest' (moving) + the commit SHA (traceable)
          tags: |
            ghcr.io/mars9563/hibiki-server:latest
            ghcr.io/mars9563/hibiki-server:${{ github.sha }}

      # ---- CD: write the freshly-built image's SHA into the k8s manifest and commit.
      # Argo CD watches k8s/ on main and auto-syncs -> rolling deploy. No build loop:
      # this only edits k8s/**, which is NOT in this workflow's path filter.
      - name: Deploy (bump manifest -> Argo CD syncs)
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Reset-and-retry: each attempt re-syncs to the newest main by hand, so a race
          # with the client job (which edits a different file) can never conflict.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            sed -i -E "s#(image: ghcr\.io/mars9563/hibiki-server:).*#\1${GITHUB_SHA}#" k8s/server-deployment.yaml
            git add k8s/server-deployment.yaml
            if git diff --cached --quiet; then
              echo "manifest already at ${GITHUB_SHA} — nothing to deploy"; exit 0
            fi
            git commit --quiet -m "cd: deploy hibiki-server @ ${GITHUB_SHA} [skip ci]"
            if git push origin HEAD:main; then
              echo "deployed hibiki-server @ ${GITHUB_SHA} (attempt ${attempt})"; exit 0
            fi
            echo "push race on attempt ${attempt}; retrying"; sleep $(( (RANDOM % 4) + 1 ))
          done
          echo "ERROR: failed to push manifest bump after 5 attempts"; exit 1
